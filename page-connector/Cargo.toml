[package]
name = "page-connector"
description = "Connectors for AimDB instances in one page: the in-page bus with ports and the /bus client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Only the connector substrate: the node bundle carries no AimX remote access.
aimdb-core = { workspace = true, features = ["alloc", "connector-session"] }
line-protocol = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "WorkerGlobalScope", "BinaryType", "CloseEvent"] }
