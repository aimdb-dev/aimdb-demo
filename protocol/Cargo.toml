[package]
name = "line-protocol"
description = "Frame format and join rules of the relay's /bus/<code> route."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A local stand-in for the relay's /bus/<code> route.
forwarder = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }

[[bin]]
name = "bus-forwarder"
required-features = ["forwarder"]
